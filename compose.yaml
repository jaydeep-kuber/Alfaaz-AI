# ==============================================================================
# Alfaaz - Local Development Infrastructure (AUTH-1)
# Services:
#   1. app: Next.js Web Application
#   2. db: PostgreSQL Database with named volume for persistence
#   3. mailpit: Local SMTP Testing Server & Web Inspection UI
# ==============================================================================

name: alfaaz

services:
  # ----------------------------------------------------------------------------
  # Next.js Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfaaz_frontend
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-alfaaz}:${POSTGRES_PASSWORD:-alfaaz123}@db:5432/${POSTGRES_DB:-alfaaz_dev}}
      - AUTH_SECRET=${AUTH_SECRET}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-Alfaaz <noreply@alfaaz.local>}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-gmail.com,outlook.com,hotmail.com,yahoo.com,icloud.com}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: alfaaz_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alfaaz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfaaz123}
      POSTGRES_DB: ${POSTGRES_DB:-alfaaz_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alfaaz} -d ${POSTGRES_DB:-alfaaz_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Mailpit SMTP Server & Web UI Service
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: alfaaz_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP port
      - "${MAILPIT_WEB_PORT:-8025}:8025"   # Web UI inspection port
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8025/api/v1/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Persistent Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: alfaaz_postgres_data
